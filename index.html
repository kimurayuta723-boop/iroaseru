<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css'">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
/* Layout: 地図は全面。上部バーと下部ドックをすりガラスで浮かせる。パレットは「退色見本」付きの色見本チップ。 */
:root{
  --paper:#F3F3F0;            /* 画面の地 */
  --surface:#FFFFFF;          /* カード */
  --glass:rgb(250 250 248 / .78);
  --ink:#191C1E;              /* 文字・強調 */
  --ink-2:#4B5155;
  --muted:#868C90;
  --hair:rgb(25 28 30 / .09);
  --hair-2:rgb(25 28 30 / .16);
  --warn:#B4552B;
  --shadow:0 1px 2px rgb(20 24 26 / .06), 0 8px 28px rgb(20 24 26 / .10);
  --bleach:.70;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top-h:56px; --dock-h:60px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121416; --surface:#1B1E20; --glass:rgb(27 30 32 / .74); --ink:#ECEDEA; --ink-2:#BDC2C0; --muted:#868D8B;
  --hair:rgb(236 237 234 / .08); --hair-2:rgb(236 237 234 / .16); --warn:#E39066;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .45); --bleach:.40; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121416; --surface:#1B1E20; --glass:rgb(27 30 32 / .74); --ink:#ECEDEA; --ink-2:#BDC2C0; --muted:#868D8B;
  --hair:rgb(236 237 234 / .08); --hair-2:rgb(236 237 234 / .16); --warn:#E39066;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .45); --bleach:.40; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--hair);box-shadow:var(--shadow)}
.press{transition:transform .12s ease}
.press:active{transform:scale(.97)}

/* ---------- 上部バー ---------- */
.topbar{position:fixed;z-index:900;top:calc(var(--sat) + 10px);left:var(--gl);right:var(--gr);height:var(--top-h);
  border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:21px;flex:none;display:block}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.14em;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:6px}
.tally{display:flex;align-items:center;gap:2px;padding:0 6px;font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.tally b{font-family:var(--f-mono);font-weight:500;font-size:15px;color:var(--ink);margin:0 3px 0 8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{background:var(--hair)}

/* ---------- 画面 ---------- */
main{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.page{padding:calc(var(--sat) + var(--top-h) + 34px) var(--gr) calc(var(--sab) + var(--dock-h) + 48px) var(--gl);max-width:760px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 18px}
.page-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.1em;line-height:1.2;text-wrap:balance}
.page-h p{margin:0 0 4px;font-size:12px;color:var(--muted);text-align:right}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
.sec{margin:34px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--hair);padding-top:14px}
.sec h3{margin:0;font-family:var(--f-display);font-size:16px;letter-spacing:.1em;font-weight:700}
.sec span{font-size:12px;color:var(--muted)}

/* ---------- 地図 ---------- */
#map{position:absolute;inset:0;background:var(--paper)}
.map-filter{position:absolute;z-index:800;top:calc(var(--sat) + var(--top-h) + 20px);left:var(--gl);display:flex;gap:6px}
.pill{border:1px solid var(--hair);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--ink-2);box-shadow:0 2px 10px rgb(0 0 0 / .06)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.locate{position:absolute;z-index:800;top:calc(var(--sat) + var(--top-h) + 18px);right:var(--gr);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--hair)}
.locate svg{width:20px;height:20px}
.geo-note{position:absolute;z-index:800;left:var(--gl);right:var(--gr);top:calc(var(--sat) + var(--top-h) + 70px);margin:0 auto;max-width:380px;border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--ink-2);line-height:1.55}

/* 近くの店ストリップ */
.strip{position:absolute;z-index:800;left:0;right:0;bottom:calc(var(--sab) + var(--dock-h) + 24px);display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:4px var(--gr) 10px var(--gl);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.card{flex:none;scroll-snap-align:start;width:min(72vw,248px);display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;border-radius:14px;padding:9px 12px 9px 9px;text-align:left;border:1px solid var(--hair)}
.card .cs{width:46px;height:46px;border-radius:8px;position:relative;overflow:hidden;background:var(--now)}
.card .cs::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:var(--orig)}
.card b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .m{font-size:11.5px;color:var(--muted);display:flex;gap:8px;white-space:nowrap}
.card .m .u{color:var(--warn)}
.card .m .near{color:var(--ink);font-weight:700;display:flex;align-items:center;gap:5px}
.card .m .near::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.card.is-near{border-color:var(--hair-2)}
.mk-wrap.near::before{content:"";position:absolute;left:-7px;top:-7px;width:50px;height:50px;border-radius:50%;border:2px solid var(--ink);opacity:.35;pointer-events:none}
.card-txt{min-width:0}

/* ピン */
.mk{display:block;filter:drop-shadow(0 2px 4px rgb(0 0 0 / .22));transition:transform .15s ease}
.mk-wrap:active .mk{transform:scale(.92)}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2F6FB3;border:3px solid #fff;box-shadow:0 0 0 8px rgb(47 111 179 / .18),0 1px 4px rgb(0 0 0 / .3)}
.leaflet-container{font-family:var(--f-body);background:var(--paper)}
.leaflet-control-attribution{font-size:9.5px!important;background:var(--glass)!important;color:var(--muted)!important;border-radius:6px 0 0 0;padding:1px 6px!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bottom.leaflet-right{bottom:calc(var(--sab) + var(--dock-h) + 2px)}

/* ---------- ドック ---------- */
.dock{position:fixed;z-index:950;left:var(--gl);right:var(--gr);bottom:calc(var(--sab) + 12px);display:flex;gap:10px;justify-content:center;pointer-events:none}
.tabs{pointer-events:auto;height:var(--dock-h);border-radius:20px;display:grid;grid-template-columns:repeat(3,1fr);padding:0 4px;flex:0 1 232px;min-width:0}
.pick{flex:none}
@media (max-width:360px){.pick{padding:0 14px 0 12px;font-size:14px}.pick .drop{width:24px;height:24px}}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;letter-spacing:.06em;color:var(--muted);border-radius:16px}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"] svg{stroke-width:2}
.pick{pointer-events:auto;height:var(--dock-h);border-radius:20px;border:0;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:10px;padding:0 20px 0 14px;font-weight:700;letter-spacing:.08em;box-shadow:var(--shadow)}
.pick .drop{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#B23A2E 0 33%,#C8853A 33% 50%,#5E7D4B 50% 70%,#2F5D8A 70%);box-shadow:inset 0 0 0 1.5px rgb(255 255 255 / .5)}

/* ---------- パレット ---------- */
.notice{display:flex;gap:12px;align-items:center;border-radius:12px;padding:12px 14px;margin:0 0 20px;background:var(--surface);border:1px solid var(--hair)}
.notice i{width:8px;align-self:stretch;border-radius:4px;background:var(--warn);flex:none}
.notice p{margin:0;font-size:13px;color:var(--ink-2)}
.notice b{color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
@media (min-width:560px){.chips{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chips.small{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
@media (min-width:560px){.chips.small{grid-template-columns:repeat(5,minmax(0,1fr))}}
.chip{display:flex;flex-direction:column;gap:9px;text-align:left;border:0;background:none;padding:0;min-width:0}
.chip .sw{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:6px;overflow:hidden;background:var(--now);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .05)}
.chip .scale{position:absolute;left:0;right:0;bottom:0;height:16%;display:grid;grid-template-columns:repeat(4,1fr)}
.chip .scale span{display:block}
.chip .tick{position:absolute;bottom:16%;width:2px;height:9px;margin-left:-1px;background:var(--tick,#fff);border-radius:1px}
.chip .tag{position:absolute;top:8px;left:8px;font-size:10px;letter-spacing:.08em;padding:1px 7px;border-radius:999px;background:rgb(255 255 255 / .85);color:#191C1E}
.chip .meta{display:flex;flex-direction:column;gap:1px;min-width:0;padding:0 2px}
.chip .meta b{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .meta span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .meta .u{color:var(--warn)}
.chips.small .sw{aspect-ratio:1/1}
.chips.small .meta b{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.empty{border:1px dashed var(--hair-2);border-radius:12px;padding:26px 18px;color:var(--muted);font-size:13px;text-align:center;line-height:1.7}
.foot-note{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:30px;font-size:12px;color:var(--muted)}
.txt-btn{border:0;background:none;padding:6px 0;font-size:12.5px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ---------- 記録 ---------- */
.month{margin-bottom:34px}
.sort{display:flex;gap:6px;margin:-4px 0 22px}
.rmeta{display:flex;align-items:center;gap:10px}
.rt{display:flex;gap:2px}
.rt i{width:5px;height:5px;border-radius:50%;background:var(--hair-2)}
.rt i.on{background:var(--ink)}
.rate{border:1px solid var(--hair);border-radius:14px;padding:12px 12px 10px;margin:0 0 18px;background:var(--surface);transition:border-color .3s}
.rate.ask{border-color:var(--ink)}
.rate-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.rate-h b{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.rate-h span{font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.08em}
.rate-sw{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate-sw button{height:46px;border:0;border-radius:8px;padding:0;position:relative;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .05);transition:transform .15s ease}
.rate-sw button span{position:absolute;left:7px;bottom:4px;font-family:var(--f-mono);font-size:10px;color:rgb(25 28 30 / .55)}
.rate-sw button[aria-checked="true"]{transform:translateY(-3px);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.rate-ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px}
.month-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.month-h b{font-family:var(--f-display);font-size:24px;letter-spacing:.06em}
.month-h span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.month-h em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
.band{display:flex;gap:3px;height:96px;margin-bottom:6px}
.band button{flex:1;border:0;padding:0;border-radius:3px;min-width:6px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;padding:11px 0;border:0;border-bottom:1px solid var(--hair);background:none;text-align:left}
.row i{width:14px;height:14px;border-radius:3px;display:block}
.row b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{font-size:11.5px;color:var(--muted)}
.tools-row{display:flex;gap:10px;flex-wrap:wrap}
.ghost{border:1px solid var(--hair-2);background:transparent;border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}

/* ---------- シート ---------- */
.scrim{position:fixed;inset:0;background:rgb(8 10 12 / .38);z-index:1000;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;max-height:calc(100% - var(--sat) - 24px);overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;
  padding:8px var(--gr) calc(28px + var(--sab)) var(--gl);box-shadow:0 -12px 40px rgb(0 0 0 / .2)}
@media (min-width:640px){.sheet{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:20px;border-radius:22px;max-height:calc(100% - 40px)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--hair-2);margin:4px auto 14px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:.08em;line-height:1.35;text-wrap:balance}
.sheet-h p{margin:4px 0 0;color:var(--muted);font-size:13px}
.x{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:var(--hair);display:grid;place-items:center;color:var(--ink-2)}
.x svg{width:16px;height:16px}
.btn{border:0;border-radius:14px;padding:14px 16px;background:var(--ink);color:var(--paper);font-weight:700;letter-spacing:.06em;width:100%;text-align:center;text-decoration:none;display:block}
.btn:disabled{opacity:.3}
.btn.sub{background:var(--surface);color:var(--ink);border:1px solid var(--hair-2);font-weight:500}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}

/* 拾う */
.steps{display:flex;gap:6px;align-items:center;margin:-6px 0 16px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.steps span{display:flex;align-items:center;gap:6px}
.steps span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--hair-2)}
.steps span.on{color:var(--ink);font-weight:700}
.steps span.on::before{background:var(--ink)}
.steps i{width:16px;height:1px;background:var(--hair-2)}
.start{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start label{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:26px;border-radius:16px;padding:16px;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer;min-height:132px;position:relative}
.start label.sub{background:var(--surface);color:var(--ink);border:1px solid var(--hair-2)}
.start label small{display:block;font-weight:400;font-size:11.5px;opacity:.7;margin-top:2px}
.start svg{width:26px;height:26px}
.start input{position:absolute;opacity:0;width:1px;height:1px}
.photo-wrap{position:relative;border-radius:14px;overflow:hidden;background:var(--surface)}
#pickCanvas{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain;touch-action:manipulation;cursor:crosshair}
.loupe{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgb(0 0 0 / .35),0 4px 12px rgb(0 0 0 / .3);transform:translate(-50%,-50%);pointer-events:none}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 0}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swatches button{aspect-ratio:1/1;max-width:100%;border-radius:10px;border:0;padding:0;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06);transition:transform .15s ease}
.swatches button[aria-pressed="true"]{transform:translateY(-3px);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.picked{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--hair)}
.picked .big{height:64px;border-radius:8px}
.picked .nm{font-family:var(--f-display);font-size:20px;letter-spacing:.08em;font-weight:700;line-height:1.3}
.pk-txt{min-width:0}
.kana{display:block;font-size:10.5px;letter-spacing:.18em;color:var(--muted)}
.dento-ref{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
.dento-ref i{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08)}
.picked .mono{font-size:12px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.06em}
label.f input,label.f textarea{border:1px solid var(--hair-2);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink);width:100%}
label.f input:focus,label.f textarea:focus{outline:none;border-color:var(--ink)}
label.f textarea{min-height:72px;resize:vertical}
#miniMap{height:200px;border-radius:14px;border:1px solid var(--hair);position:relative}
.locline{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.locline button{border:1px solid var(--hair-2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px}
.pick-pin{width:28px;height:36px;position:relative}
.pick-pin::before{content:"";position:absolute;left:3px;top:0;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pin,var(--ink));border:3px solid #fff;box-shadow:0 2px 6px rgb(0 0 0 / .3)}
.save-bar{position:sticky;bottom:calc(-28px - var(--sab));margin:4px calc(-1 * var(--gr)) calc(-28px - var(--sab)) calc(-1 * var(--gl));padding:12px var(--gr) calc(16px + var(--sab)) var(--gl);background:linear-gradient(180deg,transparent,var(--paper) 30%)}

/* 詳細 */
.hero{position:relative;height:200px;border-radius:16px;overflow:hidden;background:var(--now);margin-bottom:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;color:var(--on)}
.hero.split{background:linear-gradient(90deg,var(--a) 50%,var(--b) 50%)}
.hero h2{margin:0;font-family:var(--f-display);font-size:26px;letter-spacing:.08em;line-height:1.3;text-wrap:balance}
.hero p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.hero .tag{position:absolute;top:14px;left:16px;font-size:10.5px;letter-spacing:.1em;padding:2px 9px;border-radius:999px;background:rgb(255 255 255 / .85);color:#191C1E}
.hero .x{position:absolute;top:12px;right:12px;background:rgb(255 255 255 / .8);color:#191C1E}
.hero .half{position:absolute;top:14px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:rgb(255 255 255 / .85);color:#191C1E}
.timeline{margin:6px 0 20px}
.tl-bar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--c0),var(--c1) 33.3%,var(--c2) 66.6%,var(--c3))}
.tl-now{position:absolute;top:-5px;width:4px;height:20px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--paper)}
.tl-lab{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--hair);border-radius:14px;background:var(--surface);margin-bottom:16px}
.stats div{padding:12px 12px 10px;min-width:0}
.stats div+div{border-left:1px solid var(--hair)}
.stats dt{font-size:10.5px;color:var(--muted);letter-spacing:.08em;margin:0}
.stats dd{margin:2px 0 0;font-family:var(--f-mono);font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.stats dd.u{color:var(--warn)}
.memo{font-size:14.5px;line-height:1.75;margin:0 0 16px;padding-left:14px;border-left:2px solid var(--hair-2);white-space:pre-wrap;color:var(--ink-2)}
.thumb{width:100%;border-radius:14px;display:block;margin-bottom:16px;max-height:240px;object-fit:cover}
.cname{margin:4px 0 18px}
.cname.two{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.cname em{font-style:normal;color:var(--muted)}
.dt{display:flex;gap:12px;align-items:center;min-width:0}
.dt i{width:36px;height:36px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}
.dt div{display:flex;flex-direction:column;min-width:0}
.dt b{font-family:var(--f-display);font-size:19px;letter-spacing:.08em;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt b small{font-family:var(--f-body);font-size:11px;font-weight:400;letter-spacing:.04em;color:var(--muted);margin-left:2px}
.dt .mono{font-size:10.5px;color:var(--muted)}
.chip .meta .cn{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.row .cn{font-family:var(--f-display);font-size:11.5px;color:var(--muted);margin-left:8px;letter-spacing:.06em;font-weight:400}
.danger-row{display:flex;justify-content:center;margin-top:6px}
.danger-row button{border:0;background:none;color:var(--warn);font-size:13px;padding:8px}
.confirm{border:1px solid var(--warn);border-radius:14px;padding:14px;font-size:13px}
.confirm p{margin:0 0 12px}
.btn.danger{background:var(--warn);color:#fff}

/* トースト */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + var(--top-h) + 22px);z-index:1200;border-radius:14px;padding:11px 14px;font-size:13px;width:max-content;max-width:min(calc(100vw - 32px),420px);display:flex;gap:10px;align-items:center;color:var(--ink)}
.toast i{width:22px;height:22px;border-radius:5px;flex:none}
.toast button{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 12px;font-size:12px;white-space:nowrap;margin-left:4px}

@media (prefers-reduced-motion:no-preference){
  .sheet{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
  @media (min-width:640px){@keyframes sheetUp{from{transform:translate(-50%,40px);opacity:.4}}}
  .toast{animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes toastIn{from{transform:translate(-50%,-10px);opacity:0}}
  .view.enter{animation:fadeIn .2s ease-out}
  .mk-wrap.near::before{animation:nearPulse 2s ease-out infinite}
  @keyframes nearPulse{0%{transform:scale(.72);opacity:.55}100%{transform:scale(1.25);opacity:0}}
  @keyframes fadeIn{from{opacity:.4}}
}

/* Leaflet 必須スタイル(外部CSSが読めなくても地図が崩れないよう内蔵) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;outline-offset:1px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-container .leaflet-tile-pane img,.leaflet-container .leaflet-marker-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag,.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-control-attribution{margin:0;line-height:1.5}
.leaflet-gl-layer{position:absolute;left:0;top:0}
.tiles-invert .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.6)}
.tiles-gray .leaflet-tile-pane{filter:grayscale(1) contrast(.82) brightness(1.06)}
.tiles-gray.tiles-invert .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.78) contrast(.85)}
</style>

<script>
/* 地図ライブラリを複数の配信元から順に読み込む */
function loadOne(srcs, ok){
  return new Promise(resolve => {
    let i = 0;
    (function next(){
      if(ok()) return resolve(true);
      if(i >= srcs.length) return resolve(false);
      const s = document.createElement("script");
      s.src = srcs[i++];
      s.onload = () => ok() ? resolve(true) : next();
      s.onerror = next;
      document.head.appendChild(s);
    })();
  });
}
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(false), ms))]);
window.vectorOK = false;
window.leafletReady = (async () => {
  const okL = await loadOne([
    "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js",
    "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js",
    "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
  ], () => typeof L !== "undefined");
  if(!okL) return false;
  const okM = await withTimeout(loadOne([
    "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js",
    "https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"
  ], () => typeof maplibregl !== "undefined"), 8000);
  if(okM){
    const okP = await withTimeout(loadOne([
      "https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js",
      "https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"
    ], () => typeof L.maplibreGL === "function"), 6000);
    let webgl = false;
    try{ const c = document.createElement("canvas"); webgl = !!(c.getContext("webgl2") || c.getContext("webgl")); }catch(e){}
    window.vectorOK = okP && webgl;
  }
  return true;
})();
</script>
<script>
(() => {
"use strict";
const KEY = "iroaseru.v1";
const HALF = 30, LIMIT = 90, NEAR_M = 200;
const DAY = 864e5;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const X_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';

/* ---------- 保存 ---------- */
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.places)) return s; }catch(e){}
  return { places: [], seeded: false, samplesPlaced: false };
}
let state = load();
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }

  me = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
  if($("#geoNote").dataset.kind !== "tile") geoNote("");
  if(map){
    if(!meMarker){
      meCircle = L.circle([me.lat, me.lng], { radius: me.acc, color:"#2F6FB3", weight:1, opacity:.4, fillOpacity:.06, interactive:false }).addTo(map);
      meMarker = L.marker([me.lat, me.lng], { icon: L.divIcon({ className:"", html:'<div class="me-dot"></div>', iconSize:[18,18], iconAnchor:[9,9] }), interactive:false, zIndexOffset:1000 }).addTo(map);
    } else { meMarker.setLatLng([me.lat, me.lng]); meCircle.setLatLng([me.lat, me.lng]).setRadius(me.acc); }
  }
  if(first){
    if(!state.samplesPlaced && state.places.some(p=>p.sample)) placeSamplesNear(me);
    else if(map) map.setView([me.lat, me.lng], 16);
  }
  const key = state.places.filter(isNear).map(p => p.id).join(",");
  if(key !== nearKey){ nearKey = key; renderMarkers(); }
  renderStrip();
  if(pickCtx && pickCtx.mode === "new" && pickCtx.autoLoc) setPickLoc(me, true);
}
function onPosErr(err){
  const msg = err.code === 1
    ? "位置情報が許可されていません。ブラウザの設定で、このページの位置情報を許可してください。"
    : "現在地を取得できませんでした。電波の良い場所で再度お試しください。";
  if(!me) geoNote(msg);
  if(pickCtx && pickCtx.mode === "new" && !pickCtx.loc) $("#locStatus").textContent = "現在地を取得できません。地図でピンを置いてください。";
}
function startGeo(){
  if(!("geolocation" in navigator)){ geoNote("この端末では位置情報が使えません。"); return; }
  if(!window.isSecureContext){ geoNote("位置情報は https:// で開いたときだけ使えます。"); }
  navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });
}

function renderStrip(){
  const el = $("#strip");
  let list = state.places.filter(p => statusOf(p) === "want");
  if(filter === "done"){ el.hidden = true; return; }
  if(me) list.sort((a,b) => distM(me,a) - distM(me,b));
  else list.sort((a,b) => daysLeft(a) - daysLeft(b));
  el.hidden = !list.length;
  el.innerHTML = list.slice(0, 12).map(p => {
    const left = daysLeft(p);
    return `<button class="card glass press${isNear(p) ? " is-near" : ""}" data-fly="${p.id}">
      <span class="cs" style="--now:${nowColor(p)};--orig:${p.color}"></span>
      <span class="card-txt"><b>${esc(p.name)}</b><span class="m">${isNear(p) ? '<span class="near">すぐ近く</span>' : (me ? `<span>${fmtDist(distM(me,p))}</span>` : "")}<span class="${left<=14?"u":""}">残り${left}日</span></span></span></button>`;
  }).join("");
}
function chipHTML(p){
  const st = statusOf(p), left = daysLeft(p), d = daysSince(p.savedAt);
  const steps = stepColors(p.color);
  const pos = Math.min(d / LIMIT, 1) * 100;
  const tickCol = onColor(nowColor(p));
  const sub = st === "want" ? `<span><span class="${left<=14?"u":""}">残り${left}日</span>${me ? ` · ${fmtDist(distM(me,p))}` : ""}</span>`
            : `<span>${Math.floor(d)}日前に保存</span>`;
  return `<button class="chip ${st} press" data-open="${p.id}">
    <span class="sw" style="--now:${nowColor(p)}">
      ${p.sample ? '<span class="tag">見本</span>' : ""}
      ${st === "want" ? `<span class="tick" style="left:${pos}%;--tick:${tickCol}"></span>` : ""}
      <span class="scale">${steps.map(c=>`<span style="background:${c}"></span>`).join("")}</span>
    </span>
    <span class="meta"><b>${esc(p.name)}</b><span class="cn">${dento(p.color).name}</span>${sub}</span></button>`;
}

function renderArchive(){
  const done = state.places.filter(p => p.visitedAt).sort((a,b)=>b.visitedAt-a.visitedAt);

  done.forEach(p => { const d=new Date(p.visitedAt); const k=`${d.getFullYear()}-${d.getMonth()+1}`; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(p); });

function loadPhoto(file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    if(!pickCtx){ URL.revokeObjectURL(url); return; }
    const W = 900, sc = Math.min(1, W / Math.max(img.width, img.height));
    cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
    cx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    const t = document.createElement("canvas"), ts = Math.min(1, 360 / Math.max(cv.width, cv.height));
    t.width = Math.round(cv.width*ts); t.height = Math.round(cv.height*ts);
    t.getContext("2d").drawImage(cv, 0, 0, t.width, t.height);
    pickCtx.photo = t.toDataURL("image/jpeg", .74);
    const pal = extractPalette();
    renderSwatches(pal);
    selectColor(pal[0]);
    $("#loupe").hidden = true;
    $("#pickStart").hidden = true; $("#pickWork").hidden = false;
    setStep(2);
    if(pickCtx.mode === "new") setupMiniMap();
  };
  img.onerror = () => { toast("写真を読み込めませんでした。別の写真でお試しください。"); URL.revokeObjectURL(url); };
  img.src = url;
}
function extractPalette(){
  const S = 72, t = document.createElement("canvas"), sc = S / Math.max(cv.width, cv.height);
  t.width = Math.max(1, Math.round(cv.width*sc)); t.height = Math.max(1, Math.round(cv.height*sc));
  const tc = t.getContext("2d"); tc.drawImage(cv, 0, 0, t.width, t.height);
  const d = tc.getImageData(0, 0, t.width, t.height).data, pts = [];
  for(let i=0; i<d.length; i+=4) pts.push([d[i], d[i+1], d[i+2]]);
  const K = 8; let cents = [pts[Math.floor(pts.length/2)]];
  while(cents.length < K){
    let best = null, bd = -1;
    for(let i=0;i<pts.length;i+=3){ const p=pts[i]; let m=Infinity; for(const c of cents){ const dd=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2; if(dd<m)m=dd; } if(m>bd){bd=m;best=p;} }
    cents.push(best.slice());
  }
  let counts = [];
  for(let it=0; it<10; it++){
    const sum = cents.map(()=>[0,0,0]); counts = cents.map(()=>0);
    for(const p of pts){ let bi=0,bd=Infinity; cents.forEach((c,i)=>{ const dd=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2; if(dd<bd){bd=dd;bi=i;} }); sum[bi][0]+=p[0];sum[bi][1]+=p[1];sum[bi][2]+=p[2]; counts[bi]++; }
    cents = cents.map((c,i)=> counts[i] ? sum[i].map(v=>v/counts[i]) : c);
  }
  const res = cents.map((c,i)=>{ const [,s,l]=rgbToHsl(...c); return { hex: rgbToHex(...c), n: counts[i], score: (counts[i]/pts.length) * (0.25 + s*1.6) * (l>.08 && l<.94 ? 1 : .3), rgb:c }; })
    .filter(x => x.n > 0).sort((a,b)=>b.score-a.score);
  const out = [];
  for(const r of res){ if(out.every(o => Math.hypot(o.rgb[0]-r.rgb[0], o.rgb[1]-r.rgb[1], o.rgb[2]-r.rgb[2]) > 28)) out.push(r); if(out.length===6) break; }
  return out.map(o=>o.hex);
}
function renderSwatches(pal){

}

function selectColor(hex){

  $("#dentoSw").style.background = dt.hex;
  $$("#swatches button").forEach(b => b.setAttribute("aria-pressed", b.dataset.hex === hex));
  if(miniMarker){ const el = miniMarker.getElement()?.querySelector(".pick-pin"); if(el) el.style.setProperty("--pin", hex); }

cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) / r.width * cv.width), y = Math.round((e.clientY - r.top) / r.height * cv.height);
  const R = 4, x0 = Math.max(0,x-R), y0 = Math.max(0,y-R);
  const d = cx.getImageData(x0, y0, Math.max(1,Math.min(R*2+1, cv.width-x0)), Math.max(1,Math.min(R*2+1, cv.height-y0))).data;
  let s=[0,0,0], n=0; for(let i=0;i<d.length;i+=4){ s[0]+=d[i]; s[1]+=d[i+1]; s[2]+=d[i+2]; n++; }
  const hex = rgbToHex(s[0]/n, s[1]/n, s[2]/n);
  const lp = $("#loupe"); lp.hidden = false; lp.style.left = (e.clientX - r.left) + "px"; lp.style.top = (e.clientY - r.top) + "px"; lp.style.background = hex;
  selectColor(hex);
});

function setupMiniMap(){
  if(!hasL){ $("#locStatus").textContent = "地図を読み込めないため、現在地のまま保存します。"; return; }
  const start = me || (map ? map.getCenter() : DEFAULT_CENTER);
  if(!miniMap){
    miniMap = L.map("miniMap", { zoomControl:false, attributionControl:false }).setView([start.lat, start.lng], 17);
    makeTiles(miniMap, false);
    miniMarker = L.marker([start.lat, start.lng], { draggable:true, icon: L.divIcon({ className:"", html:'<div class="pick-pin"></div>', iconSize:[28,36], iconAnchor:[14,34] }) }).addTo(miniMap);
    miniMarker.on("dragend", () => { const ll = miniMarker.getLatLng(); setPickLoc({lat:ll.lat,lng:ll.lng}, false); });
    miniMap.on("click", e => { miniMarker.setLatLng(e.latlng); setPickLoc({lat:e.latlng.lat,lng:e.latlng.lng}, false); });
  }
  setTimeout(() => { miniMap.invalidateSize(); const el = miniMarker.getElement()?.querySelector(".pick-pin"); if(el && pickCtx?.color) el.style.setProperty("--pin", pickCtx.color); }, 80);
  if(me) setPickLoc(me, true);
  else { pickCtx.loc = null; miniMap.setView([start.lat,start.lng], 16); miniMarker.setLatLng([start.lat,start.lng]); $("#locStatus").textContent = "現在地を取得しています…"; }
}
function setPickLoc(c, auto){
  if(!pickCtx) return;
  pickCtx.loc = { lat:c.lat, lng:c.lng }; pickCtx.autoLoc = auto;
  if(miniMap && miniMarker){ miniMarker.setLatLng([c.lat,c.lng]); if(auto) miniMap.setView([c.lat,c.lng], 17); }
  $("#locStatus").textContent = auto ? `現在地 · 誤差 約${Math.round(me?.acc||0)}m` : "位置を手動で調整しました";

}

function cnameHTML(p){

function openDetail(id, opt = {}){
  const p = state.places.find(x=>x.id===id); if(!p) return;
  const st = statusOf(p), f = fadeOf(p), d = daysSince(p.savedAt), now = nowColor(p);
  const sample = p.sample ? '<span class="tag">見本</span>' : "";
  let hero, timeline = "";
  if(st === "done"){
    const vc = p.visitColor || p.color;
    hero = `<div class="hero split" style="--a:${p.color};--b:${vc};color:${onColor(vc)}">
      ${sample}<span class="half" style="left:16px;${p.sample?'top:42px':''}">${fmtMD(p.savedAt)} 拾った色</span>
      <button class="x" data-close aria-label="閉じる">${X_ICON}</button>
      <div style="margin-left:50%;padding-left:14px"><h2>${esc(p.name)}</h2><p>${fmtDate(p.visitedAt)} に行きました</p></div></div>`;
  } else {
    hero = `<div class="hero" style="--now:${now};--on:${onColor(now)}">${sample}
      <button class="x" data-close aria-label="閉じる">${X_ICON}</button>
      <h2>${esc(p.name)}</h2><p>${st === "shelf" ? "縁がなかった棚にあります" : `色あせまで あと${daysLeft(p)}日`}</p></div>`;
    const sc = stepColors(p.color), pos = Math.min(d / LIMIT, 1) * 100;
    timeline = `<div class="timeline"><div class="tl-bar" style="--c0:${sc[0]};--c1:${sc[1]};--c2:${sc[2]};--c3:${sc[3]}"><span class="tl-now" style="left:${pos}%"></span></div>
      <div class="tl-lab"><span>0日</span><span>30</span><span>60</span><span>90日</span></div></div>`;
  }
  const dist = me ? fmtDist(distM(me,p)) : "—";
  const stats = st === "done"
    ? `<div><dt>保存した日</dt><dd>${fmtMD(p.savedAt)}</dd></div><div><dt>行った日</dt><dd>${fmtMD(p.visitedAt)}</dd></div><div><dt>ここから</dt><dd>${dist}</dd></div>`
    : `<div><dt>保存から</dt><dd>${Math.floor(d)}<small>日</small></dd></div><div><dt>色の残り</dt><dd class="${daysLeft(p)<=14&&st==="want"?"u":""}">${Math.round(f*100)}<small>%</small></dd></div><div><dt>ここから</dt><dd>${dist}</dd></div>`;
  const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${p.lat.toFixed(6)},${p.lng.toFixed(6)}&travelmode=walking`;
  $("#dBody").innerHTML = `
    ${hero}
    ${cnameHTML(p)}
    ${st === "done" ? rateHTML(p, opt.askRate) : ""}
    ${timeline}
    <dl class="stats">${stats}</dl>
    ${p.memo ? `<p class="memo">${esc(p.memo)}</p>` : ""}
    ${(p.visitPhoto || p.photo) ? `<img class="thumb" src="${p.visitPhoto || p.photo}" alt="${esc(p.name)}の写真">` : ""}
    <div class="stack">
      ${st !== "done" ? `<button class="btn press" id="dVisit">着いた!色を拾い直す</button>` : ""}
      ${st === "shelf" ? `<button class="btn sub press" id="dRevive">もう一度「行きたい」に戻す</button>` : ""}
      <div class="btns">
        <button class="btn sub press" id="dMap">地図で見る</button>
        <a class="btn sub press" href="${gmaps}" target="_blank" rel="noopener">経路を開く</a>
      </div>
      <div class="danger-row" id="dDelRow"><button id="dDel">この店を削除</button></div>
      <div class="confirm" id="dConfirm" hidden><p>「${esc(p.name)}」を削除します。元に戻せません。</p><div class="btns"><button class="btn sub" id="dNo">やめる</button><button class="btn danger" id="dYes">削除する</button></div></div>
    </div>`;
  openS($("#sheetDetail"));
  $$("#rateRow [data-rate]").forEach(b => b.addEventListener("click", () => {
    const r = +b.dataset.rate;
    p.rating = p.rating === r ? null : r;   // 同じ段階をもう一度押すと評価を外す
    persist(); renderAll(); updateRate(p);
  }));
  $("#dVisit")?.addEventListener("click", () => {
    if(me){ const dd = distM(me,p); if(dd > 300) toast(`店から${fmtDist(dd)}離れています。着いてから撮るのがおすすめです。`); }
    startPick("visit", p.id);
  });
  $("#dRevive")?.addEventListener("click", () => { p.savedAt = Date.now(); persist(); renderAll(); openDetail(p.id); toast("色を元に戻しました。今度こそ行きましょう。", p.color); });
  $("#dMap").addEventListener("click", () => { closeS(); show("map"); if(map) map.flyTo([p.lat,p.lng], 17, { duration:.6 }); });
  $("#dDel").addEventListener("click", () => { $("#dConfirm").hidden = false; $("#dDelRow").hidden = true; });
  $("#dNo").addEventListener("click", () => { $("#dConfirm").hidden = true; $("#dDelRow").hidden = false; });
  $("#dYes").addEventListener("click", () => { state.places = state.places.filter(x=>x.id!==p.id); persist(); closeS(); renderAll(); toast("削除しました。"); });
}

/* ---------- 見本・バックアップ ---------- */
$("#btnClearSamples").addEventListener("click", () => { state.places = state.places.filter(p=>!p.sample); persist(); renderAll(); toast("見本を消しました。"); });
$("#btnExport").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `iroaseru-backup-${fmtDate(Date.now()).replace(/\./g,"")}.json`; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
});
$("#importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ const s = JSON.parse(r.result); if(!Array.isArray(s.places)) throw 0;
      const ids = new Set(state.places.map(p=>p.id)); let n = 0;
      s.places.forEach(p => { if(!ids.has(p.id)){ state.places.push(p); n++; } });
      persist(); renderAll(); toast(`${n}件を読み込みました。`);
    }catch(err){ toast("読み込めませんでした。このアプリで書き出したファイルを選んでください。"); } };
  r.readAsText(f); e.target.value = "";
});

/* ---------- トースト ---------- */
let toastT;
function toast(html, color, actLabel, act){
  const t = $("#toast");
  t.hidden = true; void t.offsetWidth;
  t.innerHTML = (color ? `<i style="background:${color}"></i>` : "") + `<span>${html}</span>` + (actLabel ? `<button>${actLabel}</button>` : "");
  if(actLabel) t.querySelector("button").onclick = () => { t.hidden = true; act(); };
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, actLabel ? 7000 : 3600);
}

/* ---------- 起動 ---------- */
seed();
renderAll();
window.leafletReady.then(ok => {
  hasL = ok;
  initMap();
  renderAll();
  fitAll();
  startGeo();
});
setInterval(renderAll, 60*60*1000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) renderAll(); });
})();
</script>
</body>
</html>
